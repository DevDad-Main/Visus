[package]
name = "visus-app"
version = "1.12.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4.45"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
softbuffer = "0.4"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "network"] }
tiny-skia = "0.11"
ureq = "3"
visus-core = { version = "0.1.0", path = "../visus-core" }
visus-platform = { version = "0.1.0", path = "../visus-platform" }
winit = "0.30"

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.21.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
dev = []
