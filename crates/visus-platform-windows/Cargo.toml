[package]
name = "visus-platform-windows"
version = "0.1.0"
edition = "2024"

[dependencies]
visus-core = { version = "0.1.0", path = "../visus-core" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Threading", "Win32_Devices_Display", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant"] }
winreg = "0.55"
