[package]
name = "visus-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
visus-core = { version = "0.1.0", path = "../visus-core" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Networking_Connectivity", "Win32_Globalization", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Threading", "Win32_Devices_Display", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_System_SystemServices"] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3"
zbus = "5"
