name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p visus-app
      - name: Prepare signing certificate
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $pfx = Join-Path $env:RUNNER_TEMP "visus-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VISUS_CERT_FILE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Stage executable
        shell: pwsh
        run: Copy-Item target/release/visus-app.exe Visus.exe
      - name: Sign executable
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign /fd SHA256 /f "$env:VISUS_CERT_FILE" /p "$env:SIGNING_PASSWORD" `
            /tr http://timestamp.digicert.com /td SHA256 /d "Visus" Visus.exe
          & "$env:SIGNTOOL" verify /pa /v Visus.exe
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path Visus.exe -DestinationPath Visus-windows-x64.zip
          (Get-FileHash Visus.exe -Algorithm SHA256).Hash.ToLower() + "  Visus.exe" | Out-File -Encoding ascii Visus.exe.sha256
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart('v')
          $isccArgs = @("/DAppVersion=$v")
          if ($env:SIGNTOOL) {
            $signCmd = "`"$env:SIGNTOOL`" sign /fd SHA256 /f `"$env:VISUS_CERT_FILE`" /p `"$env:SIGNING_PASSWORD`" /tr http://timestamp.digicert.com /td SHA256 /d `"Visus`" `$f"
            $isccArgs += "/Svisus_sign=$signCmd"
            $isccArgs += "/DSIGN=1"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @isccArgs installer/visus.iss
          if ($env:SIGNTOOL) {
            & "$env:SIGNTOOL" verify /pa /v Visus-Setup.exe
          }
          (Get-FileHash Visus-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  Visus-Setup.exe" | Out-File -Encoding ascii Visus-Setup.exe.sha256
      - name: Remove signing certificate
        if: always() && env.SIGNING_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:VISUS_CERT_FILE"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Visus-windows-x64.zip
            Visus.exe.sha256
            Visus-Setup.exe
            Visus-Setup.exe.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace
      - run: cargo build --release -p visus-app
      - name: Package
        run: |
          mkdir visus && cp target/release/visus-app visus/visus
          tar czf Visus-linux-x64.tar.gz visus
          sha256sum Visus-linux-x64.tar.gz > Visus-linux-x64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Visus-linux-x64.tar.gz
            Visus-linux-x64.tar.gz.sha256
