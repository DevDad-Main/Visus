name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p visus-app
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/visus-app.exe Visus.exe
          Compress-Archive -Path Visus.exe -DestinationPath Visus-windows-x64.zip
          (Get-FileHash Visus.exe -Algorithm SHA256).Hash.ToLower() + "  Visus.exe" | Out-File -Encoding ascii Visus.exe.sha256
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/visus.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Visus-windows-x64.zip
            Visus.exe.sha256
            Visus-Setup.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --release -p visus-app
      - name: Package
        run: |
          mkdir visus && cp target/release/visus-app visus/visus
          tar czf Visus-linux-x64.tar.gz visus
          sha256sum Visus-linux-x64.tar.gz > Visus-linux-x64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Visus-linux-x64.tar.gz
            Visus-linux-x64.tar.gz.sha256
