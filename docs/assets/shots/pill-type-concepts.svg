  <g font-family="DejaVu Sans, sans-serif" fill="#f1f1f1">
    <text x="44" y="53" font-size="25" font-weight="bold">Visus / Pill Shape Studies</text>
    <text x="44" y="82" font-size="14" fill="#aeb4b6">Concepts only. Same content, different silhouettes. Closed at left, expanded at right.</text>
    <text x="44" y="146" font-size="19">01  Attached</text>
    <text x="44" y="170" font-size="13" fill="#aeb4b6">Current identity: melts into the screen edge.</text>
    <text x="44" y="346" font-size="19">02  Floating</text>
    <text x="44" y="370" font-size="13" fill="#aeb4b6">Detached capsule with room above it.</text>
    <text x="44" y="546" font-size="19">03  Soft Notch</text>
    <text x="44" y="570" font-size="13" fill="#aeb4b6">No flares. Broad, gently rounded lower corners.</text>
    <text x="44" y="746" font-size="19">04  Rail</text>
    <text x="44" y="770" font-size="13" fill="#aeb4b6">Very quiet while closed; unfolds into a compact console.</text>
  </g>
